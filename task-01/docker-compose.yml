name: posorderinventorysystem
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    profiles: ['app']
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL}
      PORT: ${API_PORT:?Set API_PORT}
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      EXPIRY_INTERVAL_MS: 15000
      TRUST_PROXY: 0
    ports:
      - '${API_PORT}:${API_PORT}'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    profiles: ['app']
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
        VITE_CURRENCY: ${VITE_CURRENCY:-USD}
    environment:
      PORT: ${WEB_PORT:?Set WEB_PORT}
    ports:
      - '${WEB_PORT}:${WEB_PORT}'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:
